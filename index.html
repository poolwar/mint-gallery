<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 小画家的艺术画廊</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap');

  :root {
    --bg: #faf6f1;
    --card-bg: #fffef9;
    --text: #5c4b3c;
    --accent: #e0887e;
    --accent2: #b8a9c9;
    --gold: #c9a96e;
    --shadow: rgba(80, 50, 30, 0.08);
    --polaroid: #f5f0e8;
    --stitch: #6c9ebf;
    --timeline-line: #d4c5b9;
    --timeline-dot: #e0887e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(224, 136, 126, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 60%, rgba(184, 169, 201, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(201, 169, 110, 0.05) 0%, transparent 50%);
    font-family: 'ZCOOL XiaoWei', 'STSong', 'SimSun', serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== 顶部 ===== */
  .header {
    text-align: center;
    padding: 60px 20px 40px;
    position: relative;
  }
  .header::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 200px;
    background: linear-gradient(180deg, rgba(224,136,126,0.08) 0%, transparent 100%);
    pointer-events: none; z-index: -1;
  }
  .title {
    font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', cursive;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    color: var(--accent);
    letter-spacing: 0.08em;
    text-shadow: 2px 2px 0 rgba(224,136,126,0.15);
    margin-bottom: 0.3em;
    animation: titleFloat 3s ease-in-out infinite;
  }
  @keyframes titleFloat {
    0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}
  }
  .subtitle { font-size:1.1rem; color:var(--accent2); letter-spacing:0.15em; opacity:0.8; }
  .divider {
    display:flex; align-items:center; justify-content:center;
    gap:12px; margin:10px auto 0; max-width:360px;
  }
  .divider::before,.divider::after {
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--accent2), transparent);
  }
  .divider-icon { font-size:1.3rem; opacity:0.6; animation:spinStar 6s linear infinite; }
  @keyframes spinStar {
    0%{transform:rotate(0deg) scale(1)} 50%{transform:rotate(180deg) scale(1.2)} 100%{transform:rotate(360deg) scale(1)}
  }

  /* ===== 上传区 ===== */
  .upload-zone {
    max-width:600px; margin:0 auto 50px; padding:40px 30px;
    border:2px dashed var(--accent2); border-radius:20px;
    text-align:center; cursor:pointer;
    transition:all 0.4s ease;
    background:rgba(255,255,255,0.4); backdrop-filter:blur(4px);
    position:relative; overflow:hidden;
  }
  .upload-zone::before {
    content:''; position:absolute; inset:-50%;
    background:conic-gradient(from 0deg, transparent, var(--accent2), transparent, var(--accent), transparent);
    opacity:0; transition:opacity 0.5s; animation:rotate 4s linear infinite;
  }
  @keyframes rotate { to{transform:rotate(360deg)} }
  .upload-zone:hover::before { opacity:0.06; }
  .upload-zone:hover { border-color:var(--accent); transform:translateY(-4px); box-shadow:0 16px 40px var(--shadow); }
  .upload-zone.drag-over {
    border-color:var(--accent); background:rgba(224,136,126,0.08);
    transform:scale(1.02); box-shadow:0 20px 50px rgba(224,136,126,0.15);
  }
  .upload-icon { font-size:3rem; margin-bottom:12px; animation:bounce 2s ease-in-out infinite; position:relative; z-index:1; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .upload-text { font-size:1.1rem; color:var(--text); position:relative; z-index:1; opacity:0.7; }
  .upload-hint { font-size:0.85rem; color:var(--accent2); margin-top:6px; position:relative; z-index:1; }
  /* #fileInput 使用行内样式隐藏，避免移动端 click 失效 */

  /* ===== 工具栏 ===== */
  .toolbar {
    display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
    gap:12px; padding:0 20px 30px;
    opacity:0; transform:translateY(10px); transition:all 0.6s ease;
  }
  .toolbar.visible { opacity:1; transform:translateY(0); }
  .toolbar-divider { width:1px; height:24px; background:var(--accent2); opacity:0.4; margin:0 4px; }
  .layout-btn {
    padding:8px 20px; border:1.5px solid var(--accent2); border-radius:25px;
    background:transparent; color:var(--text);
    font-family:inherit; font-size:0.9rem; cursor:pointer;
    transition:all 0.3s ease; letter-spacing:0.03em;
  }
  .layout-btn:hover { background:var(--accent2); color:white; }
  .layout-btn.active { background:var(--accent); color:white; border-color:var(--accent); }
  .stitch-toggle {
    padding:8px 20px; border:2px solid var(--stitch); border-radius:25px;
    background:transparent; color:var(--stitch);
    font-family:inherit; font-size:0.9rem; cursor:pointer;
    transition:all 0.3s ease; letter-spacing:0.03em; font-weight:bold;
  }
  .stitch-toggle:hover { background:var(--stitch); color:white; }
  .stitch-toggle.active { background:var(--stitch); color:white; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(108,158,191,0.4)} 50%{box-shadow:0 0 0 12px rgba(108,158,191,0)} }

  /* ===== 画廊通用 ===== */
  .gallery {
    max-width:1400px; margin:0 auto; padding:0 24px 80px;
  }
  .gallery.layout-masonry { columns:4; column-gap:24px; }
  .gallery.layout-grid { columns:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:24px; }
  .gallery.layout-polaroid { columns:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:30px 20px; }
  .gallery.layout-collage { columns:5; column-gap:16px; }

  /* ===== 横向时间画廊布局 ===== */
  .gallery.layout-timeline {
    columns:auto; display:flex;
    max-width:100%; margin:0; padding:16px 20px 24px;
    position:relative;
    overflow-x:auto; overflow-y:hidden;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:var(--accent2) transparent;
  }
  .gallery.layout-timeline::-webkit-scrollbar { height:6px; }
  .gallery.layout-timeline::-webkit-scrollbar-track { background:transparent; border-radius:3px; }
  .gallery.layout-timeline::-webkit-scrollbar-thumb { background:var(--accent2); border-radius:3px; opacity:0.4; }

  /* 时间线轨道 */
  .timeline-track {
    position:relative;
    display:flex;
    align-items:center;
    min-width:100%;
    padding:60px 30px 280px;
  }

  /* 中间横线 */
  .timeline-track::before {
    content:'';
    position:absolute;
    left:60px; right:60px;
    top:50%; transform:translateY(-50%);
    height:3px;
    background:linear-gradient(90deg,
      transparent 0%,
      var(--timeline-line) 3%,
      var(--timeline-line) 97%,
      transparent 100%);
    border-radius:2px;
    z-index:0;
  }

  /* ===== 日期分组列 ===== */
  .timeline-group {
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
    z-index:1;
  }

  /* 日期标记（在横线上方的一个小徽章） */
  .timeline-date-marker {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:4;
    white-space:nowrap;
    pointer-events:none;
  }
  .timeline-date-badge {
    display:inline-block;
    background:white;
    border:2px solid var(--accent);
    color:var(--accent);
    padding:6px 16px;
    border-radius:20px;
    font-family:'Ma Shan Zheng','STKaiti',cursive;
    font-size:1rem;
    letter-spacing:0.06em;
    box-shadow:0 3px 12px rgba(224,136,126,0.12);
    position:relative;
    z-index:4;
  }
  /* 日期标记上下小圆点 */
  .timeline-date-badge::before {
    content:'';
    position:absolute; top:-10px; left:50%; transform:translateX(-50%);
    width:8px; height:8px;
    background:var(--timeline-dot);
    border-radius:50%;
    border:2px solid white;
  }
  .timeline-date-badge::after {
    content:'';
    position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
    width:8px; height:8px;
    background:var(--timeline-dot);
    border-radius:50%;
    border:2px solid white;
  }

  /* ===== 时间线图片项（统一在下方泳道） ===== */
  .timeline-item {
    position:absolute;
    z-index:2;
    cursor:pointer;
    transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .timeline-item:hover { z-index:20; transform:translateY(-6px) scale(1.04); }

  /* 卡片样式 */
  .timeline-card {
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(80,50,30,0.08);
    transition:all 0.4s ease;
    position:relative;
    width:220px;
  }
  .timeline-item:hover .timeline-card {
    box-shadow:0 16px 44px rgba(80,50,30,0.18);
  }
  .timeline-card img {
    width:100%; height:180px;
    object-fit:cover;
    display:block;
    transition:transform 0.5s ease;
  }
  .timeline-item:hover .timeline-card img {
    transform:scale(1.06);
  }
  .timeline-card-info {
    padding:10px 14px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .timeline-card-name {
    font-size:0.8rem;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .timeline-card-time {
    font-size:0.7rem;
    color:var(--accent2);
    white-space:nowrap;
  }

  /* 卡片向上连接到横线 */
  .timeline-item::before {
    content:'';
    position:absolute;
    left:50%; transform:translateX(-50%);
    top:-18px;
    width:2px; height:18px;
    background:var(--timeline-line);
    z-index:1;
  }
  .timeline-item::after {
    content:'';
    position:absolute;
    left:50%; transform:translateX(-50%);
    top:-25px;
    width:12px; height:12px;
    background:white;
    border:3px solid var(--timeline-dot);
    border-radius:50%;
    z-index:3;
    box-shadow:0 2px 8px rgba(224,136,126,0.2);
  }

  /* 组内间距标记 */
  .timeline-group-spacer {
    flex-shrink:0;
    width:30px;
  }

  /* 未知时间区域 */
  .timeline-unknown-section {
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 40px;
    margin-left:20px;
    border-left:2px dashed var(--accent2);
    min-width:200px;
    z-index:1;
  }
  .timeline-unknown-badge {
    display:inline-block;
    padding:6px 18px;
    border-radius:20px;
    background:rgba(184,169,201,0.15);
    color:var(--accent2);
    font-size:0.85rem;
    letter-spacing:0.05em;
    margin-bottom:16px;
    white-space:nowrap;
  }
  .timeline-unknown-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:12px;
    max-width:600px;
  }
  .timeline-unknown-card {
    cursor:pointer;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,0.08);
    transition:transform 0.3s;
    background:white;
    width:160px;
  }
  .timeline-unknown-card:hover { transform:translateY(-4px); }
  .timeline-unknown-card img {
    width:100%; height:120px;
    object-fit:cover;
    display:block;
  }

  /* 时间线滚动提示 */
  .timeline-scroll-hint {
    display:none;
    text-align:center;
    padding:10px 20px;
    color:var(--accent2);
    font-size:0.8rem;
    opacity:0.6;
    letter-spacing:0.05em;
    animation: hintPulse 2s ease-in-out infinite;
  }
  .timeline-scroll-hint.visible { display:block; }
  @keyframes hintPulse {
    0%,100%{opacity:0.4} 50%{opacity:0.8}
  }

  /* ===== 卡片（非时间线） ===== */
  .card {
    position:relative; cursor:pointer;
    transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
    margin-bottom:24px; break-inside:avoid;
    border-radius:12px; overflow:hidden;
    background:var(--card-bg);
    box-shadow:0 4px 20px var(--shadow), 0 1px 4px rgba(0,0,0,0.04);
  }
  .card .select-overlay {
    position:absolute; inset:0;
    background:rgba(108,158,191,0.35);
    border:3px solid var(--stitch); border-radius:inherit;
    opacity:0; transition:opacity 0.25s ease;
    pointer-events:none; z-index:5;
    display:flex; align-items:center; justify-content:center;
  }
  .card .select-overlay::after {
    content:'✓'; font-size:2.5rem; color:white; font-weight:bold;
    text-shadow:0 2px 8px rgba(0,0,0,0.3);
  }
  .card.selected .select-overlay { opacity:1; }
  .card.selected { transform:scale(0.95); box-shadow:0 0 0 4px var(--stitch), 0 8px 30px rgba(108,158,191,0.25); }
  .card .select-order {
    position:absolute; top:8px; right:10px;
    background:var(--stitch); color:white;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.85rem; font-weight:bold; z-index:6;
    opacity:0; transform:scale(0.5);
    transition:all 0.25s ease; pointer-events:none;
  }
  .card.selected .select-order { opacity:1; transform:scale(1); }

  .layout-masonry .card { border-radius:12px; padding:0; }
  .layout-masonry .card:hover { transform:translateY(-8px) scale(1.02); box-shadow:0 20px 50px rgba(80,50,30,0.15); z-index:10; }
  .layout-masonry .card.selected:hover { transform:scale(0.95); }
  .layout-masonry .card img { width:100%; display:block; transition:transform 0.6s ease; }
  .layout-masonry .card:hover img { transform:scale(1.05); }
  .layout-masonry .card.selected:hover img { transform:none; }

  .layout-grid .card { border-radius:16px; margin-bottom:0; }
  .layout-grid .card:hover { transform:translateY(-6px); box-shadow:0 16px 40px rgba(80,50,30,0.14); }
  .layout-grid .card.selected:hover { transform:scale(0.95); }
  .layout-grid .card img { width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease; }
  .layout-grid .card:hover img { transform:scale(1.08); }
  .layout-grid .card.selected:hover img { transform:none; }

  .layout-polaroid .card {
    background:var(--polaroid); padding:14px 14px 50px; border-radius:4px;
    box-shadow:0 6px 24px rgba(80,50,30,0.12), 0 2px 6px rgba(0,0,0,0.06);
    margin-bottom:0; rotate:-2deg;
  }
  .layout-polaroid .card:nth-child(even){rotate:2deg}
  .layout-polaroid .card:nth-child(3n){rotate:-1.5deg}
  .layout-polaroid .card:nth-child(5n+1){rotate:3deg}
  .layout-polaroid .card:hover { transform:translateY(-10px) rotate(0deg) scale(1.06); box-shadow:0 20px 50px rgba(80,50,30,0.2); z-index:20; }
  .layout-polaroid .card.selected:hover { transform:rotate(0deg) scale(0.95); }
  .layout-polaroid .card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; border-radius:2px; }
  .layout-polaroid .card:hover img { filter:brightness(1.05); }
  .layout-polaroid .card .card-name {
    position:absolute; bottom:10px; left:14px; right:14px; text-align:center;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:'Ma Shan Zheng','STKaiti',cursive; font-size:0.95rem; color:#666;
  }

  .layout-collage .card { margin-bottom:16px; border-radius:8px; transition:all 0.3s ease; }
  .layout-collage .card:hover { transform:scale(1.04); box-shadow:0 12px 36px rgba(80,50,30,0.18); z-index:5; }
  .layout-collage .card.selected:hover { transform:scale(0.95); }
  .layout-collage .card img { width:100%; display:block; }

  .card-label {
    position:absolute; bottom:0; left:0; right:0;
    padding:30px 16px 12px;
    background:linear-gradient(transparent, rgba(0,0,0,0.5));
    color:white; font-size:0.85rem;
    opacity:0; transform:translateY(10px);
    transition:all 0.35s ease; pointer-events:none;
  }
  .card:hover .card-label { opacity:1; transform:translateY(0); }
  .layout-polaroid .card .card-label { display:none; }

  /* 删除按钮 */
  .card-delete {
    position:absolute; top:8px; right:8px; z-index:10;
    width:28px; height:28px; border-radius:50%;
    background:rgba(0,0,0,0.55); color:#fff; border:none;
    font-size:14px; line-height:28px; text-align:center;
    cursor:pointer; opacity:0;
    transition:opacity 0.2s ease, background 0.2s ease;
    pointer-events:auto;
  }
  .card:hover .card-delete,
  .timeline-item:hover .card-delete,
  .timeline-unknown-card:hover .card-delete { opacity:1; }
  .card-delete:hover { background:rgba(220,50,50,0.85); }
  /* 移动端始终显示删除按钮 */
  @media (hover:none) {
    .card-delete { opacity:0.7; width:24px; height:24px; font-size:12px; line-height:24px; }
  }

  /* ===== Lightbox ===== */
  .lightbox {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.92); z-index:1000;
    justify-content:center; align-items:center;
    opacity:0; transition:opacity 0.4s ease;
  }
  .lightbox.open { display:flex; opacity:1; }
  .lightbox-img {
    max-width:90vw; max-height:85vh; object-fit:contain; border-radius:8px;
    box-shadow:0 0 80px rgba(224,136,126,0.2);
    transform:scale(0.9); transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .lightbox.open .lightbox-img { transform:scale(1); }
  .lightbox-close {
    position:fixed; top:24px; right:32px; font-size:2.5rem;
    color:white; cursor:pointer; z-index:1002; opacity:0.6;
    transition:opacity 0.3s; width:48px; height:48px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(255,255,255,0.06); line-height:1;
  }
  .lightbox-close:hover{opacity:1; background:rgba(255,255,255,0.12)}
  .lightbox-nav {
    position:fixed; top:50%; transform:translateY(-50%);
    font-size:2.5rem; color:white; cursor:pointer; z-index:1002; opacity:0.5;
    transition:all 0.3s; width:56px; height:56px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(255,255,255,0.05);
  }
  .lightbox-nav:hover{opacity:1; background:rgba(255,255,255,0.12)}
  .lightbox-prev{left:24px} .lightbox-next{right:24px}
  .lightbox-info {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,0.7); font-size:0.9rem; letter-spacing:0.05em; z-index:1002;
  }

  /* ===== 拼接面板 ===== */
  .stitch-panel {
    position:fixed; bottom:0; left:0; right:0;
    background:white; box-shadow:0 -4px 30px rgba(0,0,0,0.12);
    z-index:500; padding:16px 24px;
    display:flex; align-items:center; justify-content:center;
    gap:16px; flex-wrap:wrap;
    transform:translateY(100%);
    transition:transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .stitch-panel.open { transform:translateY(0); }
  .stitch-panel-label { font-weight:bold; color:var(--stitch); letter-spacing:0.05em; font-size:0.95rem; }
  .stitch-layout-btn {
    padding:8px 16px; border:1.5px solid #ddd; border-radius:20px;
    background:white; cursor:pointer; font-family:inherit; font-size:0.85rem;
    transition:all 0.25s ease; white-space:nowrap;
  }
  .stitch-layout-btn:hover{ border-color:var(--stitch); color:var(--stitch); }
  .stitch-layout-btn.active-layout{ background:var(--stitch); color:white; border-color:var(--stitch); }
  .stitch-action-btn {
    padding:10px 28px; border:none; border-radius:25px;
    font-family:inherit; font-size:0.95rem; cursor:pointer;
    transition:all 0.3s ease; font-weight:bold; letter-spacing:0.05em;
  }
  .stitch-preview-btn{ background:var(--stitch); color:white; }
  .stitch-preview-btn:hover{ transform:translateY(-2px); box-shadow:0 6px 20px rgba(108,158,191,0.3); }
  .stitch-cancel-btn{ background:#f0f0f0; color:#888; }
  .stitch-cancel-btn:hover{ background:#e0e0e0; }

  /* 拼接模态框 */
  .stitch-modal {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.85); z-index:2000;
    justify-content:center; align-items:center;
    flex-direction:column; gap:24px;
    opacity:0; transition:opacity 0.4s ease;
  }
  .stitch-modal.open { display:flex; opacity:1; }
  .stitch-modal-canvas-wrap {
    position:relative; background:white; border-radius:16px; padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    max-width:92vw; max-height:78vh; overflow:auto;
    display:flex; align-items:center; justify-content:center;

 // 时间线缓存: { dated: [{img,date}], unknown: [img] }

    var fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._\-一-龥]/g, '_');

    }), error = _a.error;

    // 获取公开 URL
    var _b = getSupabase().storage.from(SUPABASE_BUCKET).getPublicUrl(filePath), publicUrl = _b.data.publicUrl;
    return {
      name: file.name,
      url: publicUrl,
      path: filePath,
      savedAt: new Date().toISOString()
    };

  // 从 Supabase 加载所有云端图片
  async function loadFromSupabase() {

    }), data = _a.data, error = _a.error;
    if (error) throw error;

    return data.map(function(item) {

      // 从文件名提取原始名称（去掉时间戳前缀）

  // 将 Blob/File 转 base64 data URI
  function blobToBase64(blob) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() { resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);

  async function buildFullHTML() {
    btnSaveToFile.textContent = '⏳ 处理中...';

      var embeddedData = [];

        // 如果图片是 blob URL，需要转 base64
        if (img.url && img.url.startsWith('blob:')) {

            if (img.file) {

              // 带超时的 fetch，避免卡死
              var controller = new AbortController();
              var timeoutId = setTimeout(function() { controller.abort(); }, 10000);
              try {
                var resp = await fetch(img.url, { signal: controller.signal });
                blob = await resp.blob();
              } finally {
                clearTimeout(timeoutId);
              }
            }
            dataUri = await blobToBase64(blob);
          } catch(e) {
            console.warn('转换图片失败:', img.name, e);
            // 跳过无法转换的图片
            showToast('⚠️ 跳过: ' + img.name);
            continue;
          }
        }

        embeddedData.push({
          name: img.name,
          data: dataUri,
          dateTaken: img.dateTaken ? img.dateTaken.toISOString() : null,
          savedAt: img.savedAt || new Date().toISOString()
        });
      }

      // 获取当前 HTML 源码
      var htmlText;
      try {
        var resp = await fetch(location.href);
        htmlText = await resp.text();
      } catch(e) {
        htmlText = document.documentElement.outerHTML;
      }

      // 替换 EMBEDDED_IMAGES 数组

      var re = /(var\s+EMBEDDED_IMAGES\s*=\s*)[\s\S]*?(;)/;
      if (re.test(htmlText)) {
        htmlText = htmlText.replace(re, '$1' + newImagesJson + '$2');
      } else {
        htmlText = htmlText.replace(
          'function initEmbedded()',
          'const EMBEDDED_IMAGES = ' + newImagesJson + ';\nfunction initEmbedded()'
        );      }

  // 写入文件（支持覆写原文件或下载新文件）
  async function saveHTMLToDisk(htmlContent) {
    var fileName = '薄荷的画廊.html';

    // 方案 A: File System Access API（Chrome/Edge — 可覆写原文件）
    try {
      var handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
      });
      var writable = await handle.createWritable();
      await writable.write(htmlContent);
      await writable.close();
      showToast('✅ 已保存！所有照片已嵌入文件，分享转发永不丢失');
      return;
    } catch(e) {
      if (e.name === 'AbortError') {
        showToast('已取消保存');
        return;
      }
      // 降级到下载
    }

    // 方案 B: 下载新文件（Safari/Firefox 等不支持 File System API 的浏览器）
    var blob = new Blob([htmlContent], { type: 'text/html;charset=UTF-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('📥 下载完成！请用新文件替换原文件。所有照片已嵌入，分享转发永不丢失');
  }

  // ==============================
  //  EXIF 日期提取
  // ==============================
  function extractDateFromJPEG(arrayBuffer){
    try{
      const data=new Uint8Array(arrayBuffer);
      let pos=2; // skip SOI (0xFFD8)
      while(pos<data.length-2){
        if(data[pos]!==0xFF)break;
        const marker=data[pos+1];
        if(marker===0xDA)break; // SOS - start of scan, stop
        const len=(data[pos+2]<<8)|data[pos+3];
        if(marker===0xE1){ // APP1 - EXIF
          const exifData=data.subarray(pos+4,pos+2+len);
          // Check "Exif\0\0" header
          const header=String.fromCharCode(...exifData.slice(0,6));
          if(header!=='Exif\x00\x00')return null;
          const tiff=exifData.slice(6);
          return readTIFFDate(tiff);
        }
        pos+=2+len;
      }
    }catch(e){/* ignore */}
    return null;
  }

  function readTIFFDate(tiff){
    const view=new DataView(tiff.buffer, tiff.byteOffset, tiff.byteLength);
    const littleEndian=tiff[0]===0x49&&tiff[1]===0x49;
    const bigEndian=tiff[0]===0x4D&&tiff[1]===0x4D;
    if(!littleEndian&&!bigEndian)return null;
    const le=littleEndian;
    const magic=view.getUint16(2,le);
    if(magic!==0x002A)return null;
    let ifdOffset=view.getUint32(4,le);
    return readIFD(view,ifdOffset,le);
  }

  function readIFD(view,offset,le){
    try{
      const entries=view.getUint16(offset,le);
      for(let i=0;i<entries;i++){
        const entryOff=offset+2+i*12;
        const tag=view.getUint16(entryOff,le);
        const type=view.getUint16(entryOff+2,le);
        const count=view.getUint32(entryOff+4,le);
        // DateTimeOriginal = 0x9003, DateTimeDigitized = 0x9004, DateTime = 0x0132
        if(tag===0x9003||tag===0x9004||tag===0x0132){
          if(type===2&&count<=32){ // ASCII string
            const valOff=entryOff+8;
            const strBytes=[];
            for(let j=0;j<count-1;j++){ // skip null terminator
              const b=view.getUint8(valOff+j);
              if(b===0)break;
              strBytes.push(b);
            }
            const str=String.fromCharCode(...strBytes);
            // Parse "YYYY:MM:DD HH:MM:SS"
            const m=str.match(/(\d{4}):(\d{2}):(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
            if(m){
              return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
            }
          }
        }
      }
    }catch(e){/* ignore */}
    return null;
  }

  async function extractDateFromImage(imgObj){
    // 优先用文件的 lastModified（如果是 File）
    if(imgObj.file){
      return imgObj.file.lastModified ? new Date(imgObj.file.lastModified) : null;
    }
    // 尝试 fetch 图片并解析 EXIF
    try{
      const resp=await fetch(imgObj.url);
      const blob=await resp.blob();
      // 只对 JPEG 解析 EXIF
      if(blob.type==='image/jpeg'||imgObj.name.toLowerCase().endsWith('.jpg')||imgObj.name.toLowerCase().endsWith('.jpeg')){
        const buf=await blob.arrayBuffer();
        const date=extractDateFromJPEG(buf);
        if(date)return date;
      }
    }catch(e){/* ignore */}
    return null;
  }

  async function extractAllDates(){
    let needExtract=allImages.filter(img=>!img._dateExtracted);
    if(!needExtract.length&&timelineData)return; // 已提取过
    needExtract=allImages;
    const results=await Promise.all(needExtract.map(img=>extractDateFromImage(img).catch(()=>null)));
    results.forEach((date,i)=>{needExtract[i].dateTaken=date;needExtract[i]._dateExtracted=true});
    buildTimelineData();
    // 如果当前是时间线视图，刷新
    if(currentLayout==='timeline')renderAll();
  }

  function buildTimelineData(){
    const dated=[];
    const unknown=[];
    allImages.forEach(img=>{
      if(img.dateTaken){dated.push({img,date:img.dateTaken})}
      else{unknown.push(img)}
    });
    dated.sort((a,b)=>a.date-b.date);
    timelineData={dated,unknown};
  }

  function formatDate(date){
    const y=date.getFullYear();
    const m=String(date.getMonth()+1).padStart(2,'0');
    const d=String(date.getDate()).padStart(2,'0');
    const h=String(date.getHours()).padStart(2,'0');
    const min=String(date.getMinutes()).padStart(2,'0');
    return `${y}年${m}月${d}日 ${h}:${min}`;
  }

  function formatDateShort(date){
    const y=date.getFullYear();
    const m=String(date.getMonth()+1).padStart(2,'0');
    const d=String(date.getDate()).padStart(2,'0');
    return `${y}/${m}/${d}`;
  }

  function getDateGroup(date){
    const y=date.getFullYear();
    const m=date.getMonth()+1;
    return `${y}年${m}月`;
  }

  // ==============================

  function handleFiles(){
    const files=Array.from(fileInput.files);
    if(files.length)processFiles(files);

  function processFiles(files){
    const imageFiles=files.filter(f=>f.type.startsWith('image/'));
    if(!imageFiles.length)return;
    // 显示上传中状态
    showToast('正在上传 ' + imageFiles.length + ' 张照片到云端...');
    // 逐个上传到 Supabase
    var uploadPromises = imageFiles.map(function(f) {
      return uploadToSupabase(f).then(function(result) {
        return {
          name: result.name,
          url: result.url,
          path: result.path,
          dateTaken: null,
          _dateExtracted: false,
          _fromCloud: true,
          savedAt: result.savedAt
        };
      }).catch(function(e) {
        console.warn('上传失败: ' + f.name, e);
        return null;
      });
    });
    Promise.all(uploadPromises).then(function(results) {
      var uploadedImages = results.filter(function(r) { return r !== null; });
      if (!uploadedImages.length) {
        showToast('上传失败，请重试');
        return;
      }
      // 去重：同名的旧图移除，新图放最上面
      var newNames = {};
      uploadedImages.forEach(function(img) { newNames[img.name] = true; });
      allImages = allImages.filter(function(img) { return !newNames[img.name]; });
      allImages = uploadedImages.concat(allImages);
      sortBySavedAt();
      selectedSet.clear();
      selectedOrder = [];
      timelineData = null;
      renderAll();
      showToast('成功上传 ' + uploadedImages.length + ' 张照片 ✓');
      // 异步提取 EXIF
      extractAllDates().then(function() {
        if (currentLayout === 'timeline') renderAll();
      });
    }).catch(function(e) {
      console.warn('上传过程出错:', e);
      showToast('上传失败，请重试');
    });
  }

  function deleteImage(idx, e) {
    if (e) { e.stopPropagation(); e.preventDefault(); }

    if (!confirm('确定要删除 "' + img.name + '" 吗？\n⚠️ 云端图片删除后所有人都会看不到。')) return;

    // 从 Supabase 删除（仅云端上传的图片）

      deleteFromSupabase(img.path).catch(function(err) {
        console.warn('云端删除失败:', err);
      });
    }
    // 释放 blob URL（如果有）
    if (img.url && img.url.startsWith('blob:')) {
      URL.revokeObjectURL(img.url);
    }
    // 从数组中移除
    allImages.splice(idx, 1);
    // 更新选中状态
    selectedSet.delete(idx);
    selectedOrder = selectedOrder.filter(function(i) { return i !== idx; });
    // 重新映射大于 idx 的选中索引
    var newSet = new Set();
    selectedSet.forEach(function(i) {
      newSet.add(i > idx ? i - 1 : i);
    });

  function renderTimeline(){
    if(!timelineData)buildTimelineData();

    const {dated,unknown}=timelineData;
    if(!dated.length&&!unknown.length)return;

    // 创建横向滚动轨道
    const track=document.createElement('div');
    track.className='timeline-track';

    const CARD_W=220;       // 卡片宽度
    const CARD_H=180;       // 卡片图片高度
    const CARD_INFO_H=52;   // 信息栏高度
    const TOTAL_CARD_H=CARD_H+CARD_INFO_H;
    const GAP_ABOVE=16;     // 卡片到中心线的距离
    const ITEM_SPACING=5;   // 同一组内卡片间距
    const GROUP_SPACING=8;  // 不同组之间的间隔
    const SIDE_PADDING=10;  // 最左最右留白

    let lastGroup='';
    let currentX=SIDE_PADDING;

    // 先建立月份分组
    const groups=[];
    dated.forEach(item=>{
      const g=getDateGroup(item.date);
      if(!groups.length||groups[groups.length-1].label!==g){
        groups.push({label:g,items:[]});
      }
      groups[groups.length-1].items.push(item);
    });

    // 计算轨道总宽度
    let totalWidth=SIDE_PADDING;
    groups.forEach(g=>{
      totalWidth+=g.items.length*(CARD_W+ITEM_SPACING)+GROUP_SPACING;
    });
    if(unknown.length)totalWidth+=300; // 未知区域宽度
    totalWidth+=SIDE_PADDING;

    track.style.minWidth=totalWidth+'px';

    // 渲染每个月份组
    groups.forEach((group,gi)=>{
      const startX=currentX;

      // 每组的卡片
      group.items.forEach((item,ii)=>{
        const el=document.createElement('div');
        el.className='timeline-item';
        el.style.left=(currentX+ii*(CARD_W+ITEM_SPACING))+'px';
        el.style.top=GAP_ABOVE+'px';  // 统一在横线下方
        el.style.width=CARD_W+'px';
        el.innerHTML=`
          <div class="timeline-card" style="position:relative;">
            <button class="card-delete" title="删除">✕</button>
            <img src="${item.img.url}" alt="${item.img.name}" loading="lazy"
                 onload="this.style.opacity='1'" style="opacity:0;transition:opacity 0.5s ease;height:${CARD_H}px;object-fit:cover;">
            <div class="timeline-card-info">
              <span class="timeline-card-name" title="${item.img.name}">${item.img.name}</span>
              <span class="timeline-card-time">🕐 ${formatDate(item.date)}</span>
            </div>
          </div>
        `;
        const globalIdx=allImages.indexOf(item.img);
        el.querySelector('.card-delete').addEventListener('click',function(e){deleteImage(globalIdx,e)});
        el.addEventListener('click',()=>openLightbox(globalIdx));
        track.appendChild(el);
      });

      // 本月结束位置
      const groupEndX=startX+group.items.length*(CARD_W+ITEM_SPACING)-ITEM_SPACING;

      // 月份标记放在组的中间位置
      const marker=document.createElement('div');
      marker.className='timeline-date-marker';
      const markerX=startX+(groupEndX-startX)/2;
      marker.style.left=markerX+'px';
      marker.innerHTML=`<span class="timeline-date-badge">📅 ${group.label}</span>`;
      track.appendChild(marker);

      currentX=groupEndX+GROUP_SPACING;
    });

    // 未知时间的图片
    if(unknown.length){
      const unkSection=document.createElement('div');
      unkSection.className='timeline-unknown-section';
      // 放在居中位置
      unkSection.style.marginTop='0px';
      unkSection.innerHTML=`<span class="timeline-unknown-badge">📷 未记录时间的作品 (${unknown.length}张)</span>`;

      const gridWrap=document.createElement('div');
      gridWrap.className='timeline-unknown-grid';
      unknown.forEach(img=>{
        const card=document.createElement('div');
        card.className='timeline-unknown-card';
        card.style.position='relative';
        card.innerHTML=`
          <button class="card-delete" title="删除">✕</button>
          <img src="${img.url}" alt="${img.name}" loading="lazy"
               onload="this.style.opacity='1'" style="opacity:0;transition:opacity 0.5s ease;">
          <div style="padding:6px 10px;font-size:0.75rem;color:#888;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${img.name}</div>
        `;
        const globalIdx=allImages.indexOf(img);
        card.querySelector('.card-delete').addEventListener('click',function(e){deleteImage(globalIdx,e)});
        card.addEventListener('click',()=>openLightbox(globalIdx));
        gridWrap.appendChild(card);
      });
      unkSection.appendChild(gridWrap);
      track.appendChild(unkSection);
    }

    gallery.appendChild(track);

    // 滚动到中间位置（最新图片附近）
    setTimeout(()=>{
      if(dated.length>0){
        const midX=totalWidth*0.6;
        gallery.scrollLeft=midX-gallery.clientWidth/2;
      }
    },100);
  }

  // ==============================
  //  拼接引擎
  // ==============================
  function loadImage(src){
    return new Promise((resolve,reject)=>{
      const img=new Image();img.crossOrigin='anonymous';
      img.onload=()=>resolve(img);img.onerror=reject;img.src=src;
    });
  }

  async function generateStitch(){
    const imgs=await Promise.all(selectedOrder.map(i=>loadImage(allImages[i].url)));
    const gap=8,bg='#ffffff',padding=20;
    let canvasW,canvasH,drawFn;

    if(stitchLayout==='horizontal'){
      const targetH=Math.min(800,Math.max(...imgs.map(i=>i.naturalHeight)));
      const scaled=imgs.map(i=>({w:Math.round(i.naturalWidth*targetH/i.naturalHeight),h:targetH}));
      const totalW=scaled.reduce((s,i)=>s+i.w,0)+gap*(imgs.length-1);
      canvasW=totalW+padding*2;canvasH=targetH+padding*2;
      drawFn=(ctx)=>{ctx.fillStyle=bg;ctx.fillRect(0,0,canvasW,canvasH);let x=padding;imgs.forEach((img,i)=>{ctx.drawImage(img,x,padding,scaled[i].w,scaled[i].h);x+=scaled[i].w+gap})};
    }else if(stitchLayout==='vertical'){
      const targetW=Math.min(800,Math.max(...imgs.map(i=>i.naturalWidth)));
      const scaled=imgs.map(i=>({w:targetW,h:Math.round(i.naturalHeight*targetW/i.naturalWidth)}));
      const totalH=scaled.reduce((s,i)=>s+i.h,0)+gap*(imgs.length-1);
      canvasW=targetW+padding*2;canvasH=totalH+padding*2;
      drawFn=(ctx)=>{ctx.fillStyle=bg;ctx.fillRect(0,0,canvasW,canvasH);let y=padding;imgs.forEach((img,i)=>{ctx.drawImage(img,padding,y,scaled[i].w,scaled[i].h);y+=scaled[i].h+gap})};
    }else{
      // grid
      const sq=Math.min(800,Math.max(...imgs.map(i=>Math.max(i.naturalWidth,i.naturalHeight))));
      const cols=imgs.length<=4?2:Math.ceil(Math.sqrt(imgs.length));
      const rows=Math.ceil(imgs.length/cols);
      canvasW=sq*cols+gap*(cols-1)+padding*2;
      canvasH=sq*rows+gap*(rows-1)+padding*2;
      drawFn=(ctx)=>{ctx.fillStyle=bg;ctx.fillRect(0,0,canvasW,canvasH);imgs.forEach((img,i)=>{const col=i%cols;const row=Math.floor(i/cols);const x=padding+col*(sq+gap);const y=padding+row*(sq+gap);const scale=Math.max(sq/img.naturalWidth,sq/img.naturalHeight);const sw=sq/scale;const sh=sq/scale;const sx=(img.naturalWidth-sw)/2;const sy=(img.naturalHeight-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,x,y,sq,sq)})};
    }

    stitchCanvas.width=canvasW;stitchCanvas.height=canvasH;
    const ctx=stitchCanvas.getContext('2d');
    ctx.fillStyle=bg;ctx.fillRect(0,0,canvasW,canvasH);
    drawFn(ctx);
    stitchCanvas.style.maxWidth=Math.min(canvasW,1200)+'px';
    stitchModal.classList.add('open');
    btnDownload.onclick=()=>{const a=document.createElement('a');a.download='拼接作品_'+Date.now()+'.png';a.href=stitchCanvas.toDataURL('image/png');a.click();showToast('拼接图已下载！🎉')};
  }

  // ==============================
  //  自由拼贴
  // ==============================
  async function openFreeStitch(){
    freeStitchModal.classList.add('open');
    const imgs=await Promise.all(selectedOrder.map(i=>loadImage(allImages[i].url)));
    const canvasW=parseInt(document.getElementById('freeCanvasW').value);
    const canvasH=parseInt(document.getElementById('freeCanvasH').value);
    const border=parseInt(document.getElementById('freeBorder').value);
    const radius=parseInt(document.getElementById('freeRadius').value);
    const cols=Math.ceil(Math.sqrt(imgs.length));
    const rows=Math.ceil(imgs.length/cols);
    const pieceW=(canvasW-border*(cols+1))/cols;
    const pieceH=(canvasH-border*(rows+1))/rows;
    freePieces=imgs.map((img,i)=>{
      const col=i%cols;const row=Math.floor(i/cols);
      const pw=pieceW*0.85;const ph=pieceH*0.85;
      const cx=border+col*(pieceW+border)+pieceW/2;
      const cy=border+row*(pieceH+border)+pieceH/2;
      return{img,x:cx-pw/2,y:cy-ph/2,w:pw,h:ph,rotation:(Math.random()-0.5)*10,idx:i};
    });
    renderFreeCanvas();
    setupFreeInteractions();
  }

  function renderFreeCanvas(){
    const canvasW=parseInt(document.getElementById('freeCanvasW').value);
    const canvasH=parseInt(document.getElementById('freeCanvasH').value);
    const border=parseInt(document.getElementById('freeBorder').value);
    const radius=parseInt(document.getElementById('freeRadius').value);
    const bgColor=document.getElementById('freeBgColor').value;
    freeCanvas.width=canvasW;freeCanvas.height=canvasH;
    freeCanvas.style.maxWidth=Math.min(canvasW,1200)+'px';
    const ctx=freeCanvas.getContext('2d');
    ctx.fillStyle=bgColor;ctx.fillRect(0,0,canvasW,canvasH);
    freePieces.forEach(piece=>{
      ctx.save();
      const cx=piece.x+piece.w/2;const cy=piece.y+piece.h/2;
      ctx.translate(cx,cy);ctx.rotate((piece.rotation*Math.PI)/180);
      ctx.shadowColor='rgba(0,0,0,0.2)';ctx.shadowBlur=12;ctx.shadowOffsetX=2;ctx.shadowOffsetY=4;
      const hw=piece.w/2;const hh=piece.h/2;
      ctx.beginPath();ctx.roundRect(-hw,-hh,piece.w,piece.h,radius);ctx.clip();
      ctx.fillStyle='white';ctx.fillRect(-hw-border,-hh-border,piece.w+border*2,piece.h+border*2);
      ctx.shadowColor='transparent';ctx.drawImage(piece.img,-hw,-hh,piece.w,piece.h);
      ctx.restore();
    });
  }

  function setupFreeInteractions(){
    const wrap=freeCanvasWrap;const canvas=freeCanvas;
    function getEventPos(e){
      const rect=canvas.getBoundingClientRect();
      const scaleX=freeCanvas.width/rect.width;
      const scaleY=freeCanvas.height/rect.height;
      const clientX=e.touches?e.touches[0].clientX:e.clientX;
      const clientY=e.touches?e.touches[0].clientY:e.clientY;
      return{x:(clientX-rect.left)*scaleX,y:(clientY-rect.top)*scaleY};
    }
    function hitTest(pos){
      for(let i=freePieces.length-1;i>=0;i--){
        const p=freePieces[i];const cx=p.x+p.w/2;const cy=p.y+p.h/2;
        const angle=(-p.rotation*Math.PI)/180;
        const dx=pos.x-cx;const dy=pos.y-cy;
        const rx=dx*Math.cos(angle)-dy*Math.sin(angle);
        const ry=dx*Math.sin(angle)+dy*Math.cos(angle);
        if(Math.abs(rx)<=p.w/2+10&&Math.abs(ry)<=p.h/2+10)return i;
      }
      return -1;
    }
    function onDown(e){
      e.preventDefault();const pos=getEventPos(e);const hit=hitTest(pos);
      if(hit>=0){
        freeDragging=hit;freeDragType='move';freeDragStart=pos;freePieceStart={...freePieces[hit]};
        const piece=freePieces.splice(hit,1)[0];freePieces.push(piece);freeDragging=freePieces.length-1;
        canvas.style.cursor='grabbing';
      }
    }
    function onMove(e){
      if(freeDragging===null){const pos=getEventPos(e);canvas.style.cursor=hitTest(pos)>=0?'grab':'default';return}
      e.preventDefault();const pos=getEventPos(e);
      const dx=pos.x-freeDragStart.x;const dy=pos.y-freeDragStart.y;
      const piece=freePieces[freeDragging];
      if(freeDragType==='move'){piece.x=freePieceStart.x+dx;piece.y=freePieceStart.y+dy}
      renderFreeCanvas();
    }
    function onUp(){freeDragging=null;freeDragType=null;canvas.style.cursor='default'}
    canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);
    canvas.addEventListener('mouseup',onUp);canvas.addEventListener('mouseleave',onUp);
    canvas.addEventListener('touchstart',onDown,{passive:false});
    canvas.addEventListener('touchmove',onMove,{passive:false});
    canvas.addEventListener('touchend',onUp);
    canvas.addEventListener('wheel',e=>{
      e.preventDefault();const pos=getEventPos(e);const hit=hitTest(pos);
      if(hit>=0){
        if(e.shiftKey){freePieces[hit].rotation+=e.deltaY>0?-3:3}
        else{const scale=e.deltaY>0?0.95:1.05;const piece=freePieces[hit];const cx=piece.x+piece.w/2;const cy=piece.y+piece.h/2;piece.w*=scale;piece.h*=scale;piece.x=cx-piece.w/2;piece.y=cy-piece.h/2}
        renderFreeCanvas();
      }
    },{passive:false});
    ['freeBgColor','freeCanvasW','freeCanvasH','freeBorder','freeRadius'].forEach(id=>{
      const el=document.getElementById(id);if(!el)return;
      el.addEventListener('input',()=>{
        const newW=parseInt(document.getElementById('freeCanvasW').value);
        const newH=parseInt(document.getElementById('freeCanvasH').value);
        const oldW=freeCanvas.width||1200;const oldH=freeCanvas.height||900;
        const sx=newW/oldW;const sy=newH/oldH;
        freePieces.forEach(p=>{p.x*=sx;p.y*=sy;p.w*=sx;p.h*=sy});
        renderFreeCanvas();
      });
    });
  }

  btnFreeDownload.onclick=()=>{
    const a=document.createElement('a');a.download='自由拼贴_'+Date.now()+'.png';
    a.href=freeCanvas.toDataURL('image/png');a.click();showToast('拼贴画已下载！🎉');
  };

  // ==============================
  //  Lightbox
  // ==============================
  function openLightbox(idx){
    currentIdx=idx;const img=allImages[idx];
    lightboxImg.src=img.url;
    let info=img.name+'  ('+(idx+1)+' / '+allImages.length+')';
    if(img.dateTaken)info+='  ·  🕐 '+formatDate(img.dateTaken);
    lightboxInfo.textContent=info;
    lightbox.classList.add('open');document.body.style.overflow='hidden';
  }
  function closeLightbox(){lightbox.classList.remove('open');document.body.style.overflow=''}
  function navigateLightbox(dir){
    if(!allImages.length)return;
    currentIdx=(currentIdx+dir+allImages.length)%allImages.length;
    const img=allImages[currentIdx];
    lightboxImg.src=img.url;
    let info=img.name+'  ('+(currentIdx+1)+' / '+allImages.length+')';
    if(img.dateTaken)info+='  ·  🕐 '+formatDate(img.dateTaken);
    lightboxInfo.textContent=info;
  }

  // ===== 时间线横向滚轮支持 =====
  gallery.addEventListener('wheel',e=>{
    if(currentLayout!=='timeline')return;
    // 如果时间线容器本身有横向滚动条，把纵向滚轮转为横向
    if(gallery.scrollWidth>gallery.clientWidth){
      e.preventDefault();
      const dy=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;
      gallery.scrollLeft+=dy*1.2; // 稍加速，体验更好
    }
  },{passive:false});
})();
</script>
